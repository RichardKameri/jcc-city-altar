envVarGroups:
  - name: jcc-city-altar-backend
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_PROFILE_IMAGE_BUCKET
        value: feedback-profile-images
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: ADMIN_ORIGIN
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: jcccityaltar@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: jcccityaltar@gmail.com
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: NODE_OPTIONS
        value: --dns-result-order=ipv4first

services:
  - type: web
    name: jcc-city-altar-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: npm run prisma:migrate:deploy && npm run start
    envVars:
      - fromGroup: jcc-city-altar-backend

  - type: web
    name: jcc-city-altar-admin-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: npm run prisma:migrate:deploy && npm run start:admin
    envVars:
      - fromGroup: jcc-city-altar-backend